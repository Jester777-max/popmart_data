name: 泡泡玛特动向 · 周度抓取

# 触发方式：
#  1) 定时：每周一 01:00 UTC（北京时间 09:00）自动运行
#  2) 手动：在 GitHub 仓库 Actions 页点 "Run workflow" 即可立即跑一次
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

# 允许工作流把更新后的 data.json 提交回仓库
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 抓取最新动向
        run: python scripts/fetch_news.py

      - name: 抓取美国门店（需配置 STORE_API_URL，否则自动跳过）
        env:
          STORE_API_URL: ${{ vars.STORE_API_URL }}
        run: python scripts/fetch_stores.py

      - name: 提交更新（若有变化）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json stores.json
          if git diff --staged --quiet; then
            echo "无变化，跳过提交。"
          else
            git commit -m "chore: 周度数据更新 $(date -u +%Y-%m-%d)"
            git push
          fi
